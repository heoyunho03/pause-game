name: Test and deploy PAUSE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pause-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build, syntax, credentials, authentication and PostgreSQL tests
        working-directory: site
        run: npm run build && npm run check && npm test
      - name: Install browser runner
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('PAUSE_CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Original 12-game regressions and full web acceptance
        run: python scripts/run-browser-tests.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pause-test-results
          path: test-results/
          retention-days: 14
      - name: Retain tested Pages build
        uses: actions/upload-artifact@v4
        with:
          name: pause-pages
          path: site/dist/
          retention-days: 14
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pause-game.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked deployment tool
        working-directory: site
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: pause-pages
          path: site/dist/
      - name: Check Cloudflare Actions Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository's Actions Secrets. No deployment was attempted."
            exit 1
          fi
      - name: Deploy tested assets and Pages Functions to existing project
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=pause-game --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Verify live API and all public assets
        run: |
          curl --fail --retry 3 https://pause-game.pages.dev/api/config
          curl --fail --retry 3 --output /dev/null https://pause-game.pages.dev/
          curl --fail --retry 3 --output /dev/null https://pause-game.pages.dev/cloud-sync.js
          curl --fail --retry 3 --output /dev/null https://pause-game.pages.dev/sync-data.js
